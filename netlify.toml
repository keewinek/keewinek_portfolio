[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# /discord used to be a page that redirected to the invite.
[[redirects]]
  from = "/discord"
  to = "https://discord.gg/VCsGp8xCtf"
  status = 302
  force = true

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
